        position: sticky;
        top: 0;
        z-index: 100;

      .main {

        grid-template-rows: 1fr auto;
        gap: 0;
        overflow: hidden;

        letter-spacing: 0.08em;

      .sidebar button {
        display: block;

        padding: 0.5rem 1rem;

    <script>
      const examples = {
        "basic-types": {
          title: "Tipi Primitivi",
          code: `// Tipi primitivi in TypeScript
let name: string = "Mario Rossi";
let age: number = 30;
let isActive: boolean = true;
let scores: number[] = [95, 87, 92];

// Tuple: array con tipi fissi per posizione
let user: [string, number] = ["admin", 42];

// Enum
enum Role {
  Admin = "ADMIN",
  Editor = "EDITOR",
  Viewer = "VIEWER"
}

let currentRole: Role = Role.Admin;

// Union types
type ID = string | number;
let userId: ID = "abc-123";
userId = 42; // OK: number è un tipo valido per ID

// Type alias
type Point = { x: number; y: number };
const origin: Point = { x: 0, y: 0 };

// Literal types
type Direction = "up" | "down" | "left" | "right";
let move: Direction = "up";`,
        },
        interfaces: {
          title: "Interfaces",
          code: `// Interface per oggetti
interface User {
  id: number;
  name: string;
  email: string;
  role: "admin" | "user";
  avatar?: string; // opzionale
  readonly createdAt: Date; // non modificabile
}

// Estensione di interface
interface AdminUser extends User {
  role: "admin";
  permissions: string[];
  lastLogin: Date;
}

// Interface per funzioni
interface Formatter {
  (value: unknown): string;
}

const jsonFormat: Formatter = (value) => JSON.stringify(value, null, 2);

// Interface generica
interface ApiResponse<T> {
  success: boolean;
  data: T;
  message: string;
  timestamp: number;
}

// Uso
const response: ApiResponse<User[]> = {
  success: true,
  data: [],
  message: "OK",
  timestamp: Date.now()
};`,
        },
        "type-guards": {
          title: "Type Guards",
          code: `// Type guard con typeof
function formatValue(value: string | number): string {
  if (typeof value === "string") {
    return value.toUpperCase(); // TS sa che è string
  }
  return value.toFixed(2); // TS sa che è number
}

// Type guard con in
interface Dog { bark(): void; breed: string; }
interface Cat { meow(): void; color: string; }

function makeSound(animal: Dog | Cat): string {
  if ("bark" in animal) {
    animal.bark(); // TS sa che è Dog
    return "Woof!";
  }
  animal.meow(); // TS sa che è Cat
  return "Meow!";
}

// Type guard personalizzato (type predicate)
interface ApiError {
  code: number;
  message: string;
}

function isApiError(value: unknown): value is ApiError {
  return (
    typeof value === "object" &&
    value !== null &&
    "code" in value &&
    "message" in value
  );
}

// Uso del type predicate
function handleResponse(res: unknown) {
  if (isApiError(res)) {
    console.error(res.code, res.message);
  }
}`,
        },
        generics: {
          title: "Generics Base",
          code: `// Funzione generica
function first<T>(arr: T[]): T | undefined {
  return arr[0];
}

const num = first([1, 2, 3]);     // tipo: number | undefined
const str = first(["a", "b"]);    // tipo: string | undefined

// Classe generica
class Stack<T> {
  private items: T[] = [];

  push(item: T): void {
    this.items.push(item);
  }

  pop(): T | undefined {
    return this.items.pop();
  }

  peek(): T | undefined {
    return this.items[this.items.length - 1];
  }

  get size(): number {
    return this.items.length;
  }
}

const numberStack = new Stack<number>();
numberStack.push(42);
numberStack.push(100);

// Generics con più parametri
function merge<A, B>(obj1: A, obj2: B): A & B {
  return { ...obj1, ...obj2 };
}

const result = merge(
  { name: "Mario" },
  { age: 30, role: "admin" }
);
// tipo: { name: string } & { age: number; role: string }`,
        },
        constraints: {
          title: "Generic Constraints",
          code: `// Constraint con extends
function getLength<T extends { length: number }>(item: T): number {
  return item.length;
}

getLength("hello");     // OK: string ha length
getLength([1, 2, 3]);   // OK: array ha length
// getLength(42);        // Errore: number non ha length

// Constraint con keyof
function getProperty<T, K extends keyof T>(obj: T, key: K): T[K] {
  return obj[key];
}

const user = { name: "Mario", age: 30, email: "m@test.it" };
const name = getProperty(user, "name"); // tipo: string
const age = getProperty(user, "age");   // tipo: number
// getProperty(user, "phone");           // Errore!

// Conditional type con constraint
type IsArray<T> = T extends unknown[] ? true : false;

type Test1 = IsArray<string[]>;  // true
type Test2 = IsArray<number>;    // false

// Factory con constraint
interface Constructor<T> {
  new (...args: unknown[]): T;
}

function create<T>(ctor: Constructor<T>): T {
  return new ctor();
}`,
        },
        utility: {
          title: "Utility Types",
          code: `interface User {
  id: number;
  name: string;
  email: string;
  password: string;
  avatar: string;
  role: "admin" | "user";
}

// Partial<T> — tutti i campi opzionali
type UpdateUser = Partial<User>;
// { id?: number; name?: string; email?: string; ... }

// Required<T> — tutti i campi obbligatori
type StrictUser = Required<User>;

// Pick<T, K> — seleziona solo alcuni campi
type UserPreview = Pick<User, "id" | "name" | "avatar">;
// { id: number; name: string; avatar: string }

// Omit<T, K> — esclude alcuni campi
type PublicUser = Omit<User, "password" | "email">;
// { id: number; name: string; avatar: string; role: "admin" | "user" }

// Record<K, V> — mappa chiavi a valori
type UserRoles = Record<string, User["role"]>;
// { [key: string]: "admin" | "user" }

// Readonly<T> — immutabile
type FrozenUser = Readonly<User>;

// Exclude / Extract
type Primitive = string | number | boolean | null;
type NonNull = Exclude<Primitive, null>;
// string | number | boolean

// ReturnType
function createUser() {
  return { id: 1, name: "test", role: "user" as const };
}
type NewUser = ReturnType<typeof createUser>;
// { id: number; name: string; role: "user" }`,
        },
        mapped: {
          title: "Mapped Types",
          code: `// Mapped type base
type Optional<T> = {
  [K in keyof T]?: T[K];
};

// Readonly deep (ricorsivo)
type DeepReadonly<T> = {
  readonly [K in keyof T]: T[K] extends object
    ? DeepReadonly<T[K]>
    : T[K];
};

// Validation errors per ogni campo
type ValidationErrors<T> = {
  [K in keyof T]?: string[];
};

interface LoginForm {
  email: string;
  password: string;
}

const errors: ValidationErrors<LoginForm> = {
  email: ["Email non valida", "Email già registrata"],
  password: ["Minimo 8 caratteri"],
};

// Trasformazione chiavi
type Getters<T> = {
  [K in keyof T as \`get\${Capitalize<string & K>}\`]: () => T[K];
};

interface Config {
  theme: string;
  lang: string;
}

type ConfigGetters = Getters<Config>;
// { getTheme: () => string; getLang: () => string }

// Filtraggio per tipo
type NumericKeys<T> = {
  [K in keyof T]: T[K] extends number ? K : never;
}[keyof T];

interface Stats {
  name: string;
  score: number;
  level: number;
  active: boolean;
}

type NumKeys = NumericKeys<Stats>; // "score" | "level"`,
        },
        discriminated: {
          title: "Discriminated Unions",
          code: `// State machine type-safe
type AsyncState<T> =
  | { status: "idle" }
  | { status: "loading" }
  | { status: "success"; data: T }
  | { status: "error"; error: Error };

// Exhaustive switch — il compiler verifica tutti i casi
function render<T>(state: AsyncState<T>): string {
  switch (state.status) {
    case "idle":
      return "In attesa dell'azione...";
    case "loading":
      return "Caricamento in corso...";
    case "success":
      return \`Dati: \${JSON.stringify(state.data)}\`;
    case "error":
      return \`Errore: \${state.error.message}\`;
  }
}

// API Events
type AppEvent =
  | { type: "LOGIN"; payload: { email: string } }
  | { type: "LOGOUT" }
  | { type: "UPDATE_PROFILE"; payload: { name: string; avatar?: string } }
  | { type: "DELETE_ACCOUNT"; payload: { confirmation: boolean } };

function handleEvent(event: AppEvent): void {
  switch (event.type) {
    case "LOGIN":
      console.log(\`Login: \${event.payload.email}\`);
      break;
    case "LOGOUT":
      console.log("Logout");
      break;
    case "UPDATE_PROFILE":
      console.log(\`Update: \${event.payload.name}\`);
      break;
    case "DELETE_ACCOUNT":
      if (event.payload.confirmation) {
        console.log("Account eliminato");
      }
      break;
  }
}`,
        },
        branded: {
          title: "Branded Types",
          code: `// Branded types: previeni mix di ID diversi
type Brand<T, B extends string> = T & { readonly __brand: B };

type UserId = Brand<number, "UserId">;
type PostId = Brand<number, "PostId">;
type OrderId = Brand<string, "OrderId">;

// Factory functions per creare branded values
function userId(id: number): UserId {
  return id as UserId;
}
function postId(id: number): PostId {
  return id as PostId;
}

// Funzioni type-safe
function getUser(id: UserId): string {
  return \`User #\${id}\`;
}
function getPost(id: PostId): string {
  return \`Post #\${id}\`;
}

const uid = userId(42);
const pid = postId(99);

getUser(uid);  // ✅ OK
getPost(pid);  // ✅ OK
// getUser(pid);  // ❌ Errore di tipo!
// getPost(uid);  // ❌ Errore di tipo!

// Branded type per validazione
type Email = Brand<string, "Email">;
type NonEmptyString = Brand<string, "NonEmptyString">;

function validateEmail(input: string): Email | null {
  const regex = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;
  return regex.test(input) ? (input as Email) : null;
}

function sendEmail(to: Email, subject: NonEmptyString): void {
  console.log(\`Sending "\${subject}" to \${to}\`);
}`,
        },
        "template-literal": {
          title: "Template Literal Types",
          code: `// Template literal types
type HttpMethod = "GET" | "POST" | "PUT" | "DELETE";
type ApiVersion = "v1" | "v2";

// Combinazione automatica di stringhe
type ApiRoute = \`/api/\${ApiVersion}/\${string}\`;

const route1: ApiRoute = "/api/v1/posts";     // ✅
const route2: ApiRoute = "/api/v2/users/42";  // ✅
// const route3: ApiRoute = "/posts";          // ❌

// Event handler types
type DomEvent = "click" | "focus" | "blur" | "change";
type EventHandler = \`on\${Capitalize<DomEvent>}\`;
// "onClick" | "onFocus" | "onBlur" | "onChange"

// CSS unit types
type CSSUnit = "px" | "rem" | "em" | "%" | "vh" | "vw";
type CSSValue = \`\${number}\${CSSUnit}\`;

const width: CSSValue = "100px";      // ✅
const height: CSSValue = "50vh";      // ✅
// const bad: CSSValue = "auto";       // ❌

// Getter/Setter automatici
type PropAccessors<T extends string> = {
  [K in T as \`get\${Capitalize<K>}\`]: () => unknown;
} & {
  [K in T as \`set\${Capitalize<K>}\`]: (value: unknown) => void;
};

type UserAccessors = PropAccessors<"name" | "email">;
// {
//   getName: () => unknown;
//   setName: (value: unknown) => void;
//   getEmail: () => unknown;
//   setEmail: (value: unknown) => void;
// }`,
        },
      };

      const codeInput = document.getElementById("codeInput");
      const output = document.getElementById("output");

      function loadExample(key) {
        const ex = examples[key];
        if (!ex) return;
        codeInput.value = ex.code;
        document.getElementById("exampleTitle").textContent = ex.title;
        updateCharCount();
        document
          .querySelectorAll(".sidebar button")
          .forEach((b) => b.classList.remove("active"));
        event.target.classList.add("active");
        analyzeCode();
      }

      function analyzeCode() {
        const code = codeInput.value;
        if (!code.trim()) {
          output.innerHTML =
            '<span class="comment">// Scrivi del codice TypeScript...</span>';
          return;
        }
        let html = "";
        const typeDecl =
          code.match(/type\s+(\w+)(?:<[^>]+>)?\s*=\s*([^;]+)/g) || [];
        const interfaces =
          code.match(/interface\s+(\w+)(?:\s+extends\s+\w+)?\s*\{/g) || [];
        const functions =
          code.match(
            /function\s+(\w+)\s*(?:<[^>]+>)?\s*\(([^)]*)\)\s*(?::\s*([^{]+))?\s*\{/g,
          ) || [];
        const variables =
          code.match(/(const|let|var)\s+(\w+)\s*:\s*([^=;]+)/g) || [];
        const enums = code.match(/enum\s+(\w+)\s*\{/g) || [];
        const classes =
          code.match(/class\s+(\w+)(?:<[^>]+>)?(?:\s+extends\s+\w+)?\s*\{/g) ||
          [];

        if (typeDecl.length > 0) {
          html += '<span class="type-info">📦 Type Aliases:</span>\n';
          typeDecl.forEach((t) => {
            html +=
              '  <span class="success">' + escapeHtml(t.trim()) + "</span>\n";
          });
          html += "\n";
        }
        if (interfaces.length > 0) {
          html += '<span class="type-info">🔷 Interfaces:</span>\n';
          interfaces.forEach((i) => {
            html +=
              '  <span class="success">' +
              escapeHtml(i.replace("{", "").trim()) +
              "</span>\n";
          });
          html += "\n";
        }
        if (enums.length > 0) {
          html += '<span class="type-info">📋 Enums:</span>\n';
          enums.forEach((e) => {
            html +=
              '  <span class="success">' +
              escapeHtml(e.replace("{", "").trim()) +
              "</span>\n";
          });
          html += "\n";
        }
        if (classes.length > 0) {
          html += '<span class="type-info">🏗️ Classes:</span>\n';
          classes.forEach((c) => {
            html +=
              '  <span class="success">' +
              escapeHtml(c.replace("{", "").trim()) +
              "</span>\n";
          });
          html += "\n";
        }
        if (functions.length > 0) {
          html += '<span class="type-info">⚡ Functions:</span>\n';
          functions.forEach((f) => {
            const m = f.match(
              /function\s+(\w+)\s*(?:<([^>]+)>)?\s*\(([^)]*)\)\s*(?::\s*(.+))?\s*\{/,
            );
            if (m) {
              const gen = m[2] ? "<" + m[2] + ">" : "";
              const ret = m[4] ? m[4].trim() : "void (inferred)";
              html +=
                '  <span class="success">' +
                escapeHtml(m[1]) +
                gen +
                "(" +
                escapeHtml(m[3].trim()) +
                ")</span>\n";
              html +=
                '    <span class="comment">→ returns: ' +
                escapeHtml(ret) +
                "</span>\n";
            }
          });
          html += "\n";
        }
        if (variables.length > 0) {
          html += '<span class="type-info">📌 Variables:</span>\n';
          variables.forEach((v) => {
            html +=
              '  <span class="success">' + escapeHtml(v.trim()) + "</span>\n";
          });
          html += "\n";
        }

        const errors = [];
        if (code.includes("any"))
          errors.push(
            '⚠️ Uso di "any" rilevato — preferire unknown o tipi espliciti',
          );
        if (code.match(/as\s+\w+/))
          errors.push(
            "ℹ️ Type assertion (as) rilevata — verificare che sia necessaria",
          );
        if (code.includes("!.") || code.includes("!;"))
          errors.push(
            "⚠️ Non-null assertion (!) — considerare optional chaining (?.)",
          );

        if (errors.length > 0) {
          html += '<span class="type-info">🔍 Lint Hints:</span>\n';
          errors.forEach(
            (e) =>
              (html +=
                '  <span class="warning" style="color:var(--warning)">' +
                e +
                "</span>\n"),
          );
        }

        const summary = `\n<span class="comment">// Riepilogo: ${typeDecl.length} types, ${interfaces.length} interfaces, ${functions.length} functions, ${variables.length} variables</span>`;
        html += summary;
        output.innerHTML = html;
        document.getElementById("statusText").textContent =
          "Analisi completata";
      }

      function escapeHtml(str) {
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function updateCharCount() {
        document.getElementById("charCount").textContent =
          codeInput.value.length + " chars";
      }

      function copyCode() {
        navigator.clipboard.writeText(codeInput.value).then(() => {
          document.getElementById("statusText").textContent =
            "Copiato negli appunti!";
          setTimeout(
            () =>
              (document.getElementById("statusText").textContent = "Pronto"),
            2000,
          );
        });
      }

      function toggleTheme() {
        const html = document.documentElement;
        const next =
          html.getAttribute("data-theme") === "dark" ? "light" : "dark";
        html.setAttribute("data-theme", next);
        document.getElementById("themeIcon").className =
          next === "dark" ? "bi bi-sun-fill" : "bi bi-moon-stars-fill";
        localStorage.setItem("demo_theme", next);
      }
      (() => {
        const s = localStorage.getItem("demo_theme");
        if (s) {
          document.documentElement.setAttribute("data-theme", s);
          document.getElementById("themeIcon").className =
            s === "dark" ? "bi bi-sun-fill" : "bi bi-moon-stars-fill";
        }
      })();

      loadExample("basic-types");
    </script>
  </body>
</html>
